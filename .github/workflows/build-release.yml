# Release pipeline — full test suite, real-DPAPI execution assertion, source ast
# audit, Nuitka standalone build, blocking runtime observation, package + hash,
# publish.
#
# Every one of the steps below that can fail the release (full test suite, the
# real-DPAPI execution assertion, the source ast structural audit, the blocking
# runtime observation) has NO continue-on-error and NO `if: always()` on itself
# or on any step after it — GitHub Actions' own default behaviour (a failed step
# skips every later step in the same job) is what enforces "nothing publishes if
# any of those four gates failed." No extra `if:` guard is layered on top of that
# default, on purpose: an extra guard duplicating what the platform already
# guarantees is one more place the logic could quietly drift out of sync with the
# platform's own behaviour.

on:
  workflow_dispatch: {}
  push:
    tags:
      - "v*"

env:
  # Same locked minimal flag set the D-27 probe workflow established a window
  # renders under (see probe-window.yml's own history/artifacts for that
  # empirical result). Flags are expanded only in response to an OBSERVED
  # failure on real build output, never pre-guessed. --standalone is locked
  # project-wide; the single-executable bundling mode is never used anywhere
  # in this workflow.
  #
  # Quick task 260925-k6y adds two flags (both verified against Nuitka 4.2.2's own
  # `--help`; this file must stay IDENTICAL to probe-window.yml's NUITKA_FLAGS):
  # - --windows-console-mode=disable: the black console window is now deliberately
  #   suppressed. This is safe to do only because the program now writes its own
  #   rotating log file (agent/diagnostics.py, %APPDATA%\TreedgerAgent\logs\agent.log),
  #   so a console-less build is still diagnosable. Nuitka issue #3019 reported that a
  #   --standalone tkinter window may never appear with a console-suppression flag;
  #   probe-window.yml measures D27_WINDOW_RENDERED under exactly these flags. If that
  #   probe reports no window, revert this flag in BOTH workflow files and record
  #   #3019 as a confirmed limitation.
  # - --output-filename=Treedger.exe: renames ONLY the binary. The dist folder stays
  #   build_output/main.dist (named after the main.py build shim) — that folder is
  #   build-internal; the release zip below ships it as a single top-level Treedger/
  #   folder instead. (--output-folder-name is NOT used: it always appends ".dist".)
  # Changing this value changes the cache key below; its restore-keys prefix still
  # restores the previous cache, so the next run is not a full cold 23-minute build.
  NUITKA_FLAGS: "--standalone --enable-plugin=tk-inter --assume-yes-for-downloads --include-package=agent --include-package=numpy --nofollow-import-to=agent.tests --windows-console-mode=disable --output-filename=Treedger.exe"
  # A deliberately invalid bearer token, planted into config.json before the
  # runtime-observation launch below. The program must reach its own
  # authorization-failure path and stop there — this value is never a real
  # token and is never sent anywhere with intent to succeed.
  TREEDGER_AGENT_INVALID_TOKEN: "release-gate-deliberately-invalid-token"
  TREEDGER_AGENT_BASE_URL: "https://treedger.com"
  TREEDGER_AGENT_BASE_URL_HOST: "treedger.com"

permissions:
  contents: write  # `gh release create` needs this on the default GITHUB_TOKEN

jobs:
  release:
    name: Build, verify, and publish (windows-latest)
    runs-on: windows-latest
    steps:
      - name: Checkout (full depth — the published commit SHA must be unambiguous)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        id: setup_python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Restore the Nuitka compile cache (the 23-minute numpy compile)
        # Nuitka keeps a ccache/bytecode cache and its downloaded C toolchain under
        # %LOCALAPPDATA%\Nuitka\Nuitka\Cache. A GitHub-hosted runner is ephemeral, so
        # without this step that directory starts EMPTY on every run and Nuitka
        # recompiles numpy's sources to C from scratch every single time.
        #
        # Measured cost of not having it: 1m 09s without numpy versus 23-24 minutes
        # with it (probe runs #4/#5/#6 at 23m17s / ~23m / 24m46s). Run #6 changed only
        # a PowerShell file -- no build input at all -- and was still not faster than
        # run #4, which is exactly the symptom of a cache that never survives the run.
        #
        # The key covers what actually invalidates compiled objects: the runner image,
        # the Python version, the pinned dependency set, and the Nuitka flag set. It
        # deliberately does NOT include the agent's own sources -- those compile in
        # seconds. numpy is the entire cost, and it changes only when its pin changes.
        #
        # NOTE: the FIRST run after adding this is still a cold ~23 minutes, because it
        # populates the cache. The saving appears from the second run onward.
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\Nuitka\Nuitka\Cache
          key: nuitka-${{ runner.os }}-py${{ steps.setup_python.outputs.python-version }}-${{ hashFiles('agent/requirements.txt') }}-${{ env.NUITKA_FLAGS }}
          restore-keys: |
            nuitka-${{ runner.os }}-py${{ steps.setup_python.outputs.python-version }}-${{ hashFiles('agent/requirements.txt') }}-
            nuitka-${{ runner.os }}-py${{ steps.setup_python.outputs.python-version }}-

      - name: Install dependencies + Nuitka
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          # requirements-dev.txt carries pytest, which four blocking gates below need.
          # It is NOT in requirements.txt: that file is the shipped program's runtime
          # dependency list and pytest is never a runtime import.
          pip install -r agent/requirements.txt -r agent/requirements-dev.txt nuitka

      - name: Log resolved Nuitka + numpy versions
        shell: pwsh
        run: |
          python -m pip index versions nuitka
          python -c "import numpy; print('numpy', numpy.__version__)"

      - name: Full test suite
        # pytest comes from agent/requirements-dev.txt, installed above. It is
        # NOT in requirements.txt, which is the shipped program's runtime
        # dependency list. Release run #1 failed on this exact step with
        # "No module named pytest" because nothing installed it — and six green
        # probe runs could not have caught that, since probe-window.yml shares
        # the install step but runs no tests at all.
        #
        # --strict-markers requires the "dpapi" marker to be registered in
        # agent/pytest.ini; that registration is in place. Without it this step
        # fails for an unrelated reason (an unregistered marker name) rather than
        # anything about DPAPI, so a reader debugging a red build here should
        # check agent/pytest.ini first.
        #
        # --strict-markers and --junitxml both ship in pytest core
        # (_pytest.junitxml). No plugin is needed for either, and none should be
        # added — the DPAPI assertion below reads the junit-xml report this
        # produces.
        shell: pwsh
        run: |
          python -m pytest agent/tests -q --strict-markers --junitxml=report.xml

      - name: Real-DPAPI execution assertion (D-20 — never trust pytest's own exit code for a SKIP)
        shell: pwsh
        run: |
          python -m pytest agent/tests -q --strict-markers -m dpapi --junitxml=dpapi-report.xml
          python packaging/assert_dpapi_executed.py dpapi-report.xml

      - name: Source ast structural audit (the audited commit SHA published beside the build hash)
        id: structural_audit
        shell: pwsh
        run: |
          python -m pytest agent/tests/test_sync.py -q -k StructuralAudit
          $sha = git rev-parse HEAD
          Add-Content -Path $env:GITHUB_OUTPUT -Value "commit_sha=$sha"

      - name: Nuitka build (--standalone, never the single-executable bundling mode)
        # The import-exclusion flag that tells Nuitka to skip following a
        # package into the standalone build is used EXACTLY ONCE here, for
        # `agent.tests`, and for no other package. That single use is the
        # sanctioned one described at the end of this comment, not a shortcut:
        # `agent/tests/__init__.py` exists, so `agent.tests` is a real subpackage
        # of `agent` and `--include-package=agent` recurses into it. Thirteen test
        # modules import pytest. Once pytest is installed (it has to be — four
        # blocking gates above need it) those imports become followable and the
        # whole test suite plus pytest's dependency tree would be compiled into
        # the released binary. Verified unused at runtime: no module in `agent/`
        # outside `agent/tests/` imports pytest, `agent.tests`, or `tests`.
        # It is used for nothing else, even to speed the build up:
        # 40-RESEARCH.md Pitfall 2 documents that
        # Nuitka's standalone bootstrap (restoreStandaloneEnvironment())
        # rewrites sys.path to point only at the binary's own directory, so a
        # package excluded from the build that way is never found at
        # runtime. That flag is reserved for packages verified UNUSED at
        # runtime, never for a build-time-cost shortcut on a package the
        # program actually needs (MetaTrader5, numpy).
        shell: pwsh
        run: |
          python -m nuitka $env:NUITKA_FLAGS.Split(" ") --output-dir=build_output main.py 2>&1 | Tee-Object -FilePath nuitka-build.log

      - name: Plant a deliberately invalid token into config.json
        shell: pwsh
        run: |
          $appDir = Join-Path $env:APPDATA "TreedgerAgent"
          New-Item -ItemType Directory -Path $appDir -Force | Out-Null
          # Exactly the two keys config_store.py's own docstring allows —
          # "token" and "base_url", nothing else.
          $config = [ordered]@{
            token    = $env:TREEDGER_AGENT_INVALID_TOKEN
            base_url = $env:TREEDGER_AGENT_BASE_URL
          } | ConvertTo-Json
          Set-Content -Path (Join-Path $appDir "config.json") -Value $config -Encoding utf8

      - name: Runtime observation (BLOCKING — D-17/D-18)
        # CI has no MetaTrader 5 installed, so the built .exe never reaches
        # the part of its own code that talks to the terminal over IPC — this
        # step measures a knowingly TRUNCATED execution path, not the full
        # one. A human repeats these same three measurements once on a
        # machine with MT5 installed and a real pairing (D-18's human half of
        # the split); if that measurement ever disagrees with this one, that
        # is a finding about THIS GATE, not about the build — the gate gets
        # fixed, the build does not get blamed.
        #
        # A non-zero exit here stops the job before the packaging/publish
        # steps below ever run (see the file-level comment at the top of
        # this workflow for why no extra `if:` guard is layered on top of
        # that default GitHub Actions behaviour).
        shell: pwsh
        run: |
          & ./packaging/observe_runtime.ps1 -ExePath "build_output/main.dist/Treedger.exe" -BaseUrlHost $env:TREEDGER_AGENT_BASE_URL_HOST -DurationSeconds 30

      - name: Package the standalone build + compute its hash
        # D-16 rejects a binary text audit outright — this step never reads
        # build_output/main.dist as text for any prohibited-string search; it
        # only copies the directory, zips it, checks the archive's entry NAMES
        # (never file contents), and hashes the archive.
        #
        # Layout (quick task 260925-k6y): the archive holds exactly ONE top-level
        # folder, Treedger/, with Treedger/Treedger.exe inside — instead of ~980
        # files spilled at the archive root next to a binary called main.exe. The
        # folder itself (not its contents with a wildcard) is what goes into
        # Compress-Archive, which is what produces the single top-level folder.
        # The asset name is unchanged: the web route /download/agent matches
        # ^treedger-agent-.+-windows\.zip$.
        id: package
        shell: pwsh
        run: |
          $refName = "${{ github.ref_name }}"
          $shortSha = "${{ github.sha }}".Substring(0, 7)
          $tag = if ($refName) { $refName } else { "dev-$shortSha" }
          $archiveName = "treedger-agent-$tag-windows.zip"
          if (Test-Path "release_staging") { Remove-Item -Recurse -Force "release_staging" }
          New-Item -ItemType Directory -Path "release_staging" | Out-Null
          Copy-Item -Path "build_output/main.dist" -Destination "release_staging/Treedger" -Recurse
          Compress-Archive -Path "release_staging/Treedger" -DestinationPath $archiveName -Force
          # Layout assertion — fails the release unless every entry sits under
          # Treedger/ and Treedger/Treedger.exe exists.
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $archiveName).Path)
          try {
            $entries = @($zip.Entries | ForEach-Object { $_.FullName.Replace('\', '/') })
          } finally {
            $zip.Dispose()
          }
          Write-Host "Archive entries: $($entries.Count)"
          $outside = @($entries | Where-Object { -not $_.StartsWith("Treedger/") })
          if ($outside.Count -gt 0) {
            throw "Release zip layout invalid: $($outside.Count) entries outside Treedger/ (first: $($outside[0]))"
          }
          if (-not ($entries -contains "Treedger/Treedger.exe")) {
            throw "Release zip layout invalid: Treedger/Treedger.exe is missing"
          }
          Write-Host "Release zip layout OK: single top-level Treedger/ folder with Treedger/Treedger.exe"
          $hash = (Get-FileHash -Algorithm SHA256 -Path $archiveName).Hash
          $hashFileName = "$archiveName.sha256.txt"
          $commitSha = "${{ steps.structural_audit.outputs.commit_sha }}"
          @(
            "SHA-256: $hash",
            "Archive: $archiveName",
            "Audited commit: $commitSha"
          ) -join [Environment]::NewLine | Set-Content -Path $hashFileName -Encoding utf8
          Add-Content -Path $env:GITHUB_OUTPUT -Value "tag=$tag"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "archive_name=$archiveName"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "hash_file_name=$hashFileName"

      - name: Publish release
        # gh (pre-installed on windows-latest) is used instead of a
        # third-party release-publishing Action deliberately: in a public
        # repo whose entire premise is auditability (D-01), every extra
        # Action is one more thing a reader must trust to believe the
        # published binary matches the published source.
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.package.outputs.tag }}"
          gh release create $tag `
            "${{ steps.package.outputs.archive_name }}" `
            "${{ steps.package.outputs.hash_file_name }}" `
            "runtime-observation.json" `
            --title $tag `
            --notes "Audited commit: ${{ steps.structural_audit.outputs.commit_sha }}"
