[pytest]
; This is a deliberately SEPARATE pytest root from mt5-service/tests/ (currently 82/82) —
; running `python -m pytest agent/tests -q` from the repo root must neither run nor disturb
; that suite.
testpaths = tests
; Relative to this file's own directory (agent/), so ".." is the repo root — this makes
; `from agent.positions import ...` resolve without installing the package or mutating
; PYTHONPATH outside of pytest's own run.
pythonpath = ..
